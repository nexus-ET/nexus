# Copy to config.yml after running scripts/setup_cloudflare_tunnel.ps1
# (or create manually). Do not commit config.yml or *.json credentials.
#
# On Windows, run_dev.py also passes --protocol http2 and --edge-ip-version 4
# (override via NEXUS_TUNNEL_PROTOCOL / NEXUS_TUNNEL_EDGE_IP_VERSION). You can
# mirror protocol here for standalone `cloudflared tunnel run` usage:
# protocol: http2

tunnel: nexus-dev
credentials-file: credentials/nexus-dev.json

ingress:
  # Hostname must match PUBLIC_TUNNEL_BASE in backend/.env (no https:// prefix).
  - hostname: nexus-dev.yourdomain.com
    service: http://127.0.0.1:8002
  - service: http_status:404
